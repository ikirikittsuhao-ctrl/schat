<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06c755">
<title>schat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{
  --bg:#8cabd9; /* LINEトーク画面風の優しい背景アクセント用 */
  --chat-bg:#abc1ee; /* LINEのトーク画面背景色 */
  --surface:#ffffff;
  --surface2:#f2f5f8;
  --border:#e6ebf0;
  --text:#111111;
  --muted:#8e8e93;
  --primary:#06c755; /* LINEグリーン */
  --primary2:#05b34c;
  --danger:#ff3b30;
  --shadow:0 8px 30px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family: "Hannotate SC", "Handwriting", "YuAntiGothic", "Hiragino Maru Gothic ProN", "Comic Sans MS", sans-serif;
  background:var(--chat-bg);
  color:var(--text);
  height:100dvh;
  overflow:hidden
}
button,input{
  font-family: "Hannotate SC", "Handwriting", "YuAntiGothic", "Hiragino Maru Gothic ProN", "Comic Sans MS", sans-serif;
}
button{cursor:pointer}
.hidden{display:none!important}
.app{height:100dvh;max-width:1280px;margin:auto;display:flex;background:var(--surface);box-shadow:var(--shadow)}
.sidebar{width:350px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:#fff}
.topbar{height:68px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:#fff}
.brand{font-size:22px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;color:var(--primary)}
.brand i{color:var(--primary);margin-right:7px;font-size:24px}
.top-actions{display:flex;gap:7px}
.icon{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:#4a4a4a;font-size:17px;display:inline-flex;align-items:center;justify-content:center;position:relative;transition:background .15s}
.icon:hover{background:var(--surface2);color:var(--primary)}
.search{padding:11px 13px;border-bottom:1px solid var(--border);background:#fff}
.search input{width:100%;border:0;background:var(--surface2);padding:10px 15px;border-radius:20px;outline:0;font-size:13.5px}
.plan{margin:12px;padding:10px 12px;border-radius:12px;background:#e8f9ee;color:var(--primary2);font-size:12px;font-weight:600}
.rooms{flex:1;overflow:auto;background:#fff}
.room{display:flex;gap:12px;padding:12px 16px;align-items:center;border-bottom:1px solid #f6f8fa;cursor:pointer;position:relative;transition:background .15s}
.room:hover,.room.active{background:#f0f9f3}
.avatar{width:48px;height:48px;border-radius:18px;background:#e8f9ee;color:var(--primary);display:grid;place-items:center;flex:none;position:relative;font-size:20px}
.presence-dot{position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;background:#b0b9c2;border:2px solid #fff}
.presence-dot.online{background:var(--primary)}
.room-name{font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:space-between}
.room-meta{font-size:12px;color:var(--muted);margin-top:4px}
.online-text{color:var(--primary);font-weight:600}
.offline-text{color:var(--muted)}
.unread-badge{background:var(--primary);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:2px 7px;margin-left:auto}
.brand-unread{background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:2px 6px;margin-left:6px}
.nav{height:65px;border-top:1px solid var(--border);display:flex;background:#fff}
.nav button{flex:1;border:0;background:#fff;color:var(--muted);font-size:11px;position:relative;font-weight:600}
.nav button i{display:block;font-size:20px;margin-bottom:3px}
.nav button.active{color:var(--primary)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--chat-bg);position:relative}
.empty{height:100%;display:grid;place-items:center;color:#6b7c96;text-align:center;background:var(--chat-bg)}
.empty i{font-size:55px;color:#9bb2d9;margin-bottom:12px}

/* =========================================================
   LINEスタイルトーク画面 UI
   ========================================================= */
.chat-head{height:68px;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:10}
.chat-title{font-weight:800;font-size:17px;flex:1;letter-spacing:-0.3px;display:flex;align-items:center;color:#111}
.chat-actions{display:flex;gap:6px}
.chat-actions .icon{border-radius:50%;transition:all .15s ease}
.chat-actions .icon:hover{background:var(--surface2);transform:scale(1.05)}
.back{display:none}

.messages{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}

/* LINE風の吹き出しスタイル */
.msg{
  max-width:min(75%,520px);
  padding:10px 14px;
  border-radius:18px;
  line-height:1.5;
  font-size:14.5px;
  position:relative;
  touch-action:pan-y;
  user-select:none;
  transition:transform .15s ease, outline .15s ease;
  word-break:break-word;
  box-shadow:0 1px 2px rgba(0,0,0,0.06);
}
.msg.me{
  align-self:flex-end;
  background:var(--primary);
  color:#fff;
  border-top-right-radius:4px;
}
.msg.other{
  align-self:flex-start;
  background:#ffffff;
  color:#111111;
  border-top-left-radius:4px;
}
.msg.replying{outline:2px solid var(--primary);outline-offset:2px}

/* 返信プレビュー（バブル内の引用表示） */
.reply-preview{display:flex;align-items:center;gap:8px;padding:6px 10px;margin:2px 0 6px;border-radius:10px;font-size:12px;backdrop-filter:blur(4px)}
.msg.me .reply-preview{background:rgba(0,0,0,0.12);border-left:3px solid #fff;color:#fff}
.msg.other .reply-preview{background:rgba(0,0,0,0.05);border-left:3px solid var(--primary);color:var(--muted)}
.reply-preview-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-weight:500}
.reply-preview button{border:0;background:transparent;color:inherit;font-size:13px;opacity:0.8}

/* メッセージメタ情報（時刻・既読状態） */
.msg small{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:4px;
  font-size:10px;
  margin-top:4px;
  opacity:0.85;
}
.msg.me small{color:rgba(255,255,255,0.9)}
.msg.other small{color:var(--muted);justify-content:flex-start}
.read-state{font-size:10px;font-weight:700;opacity:0.95;margin-left:2px}

/* 返信アクションバー（入力欄上部） */
.reply-bar{display:none;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--border);background:#fff;font-size:13px;color:var(--text);animation:slideUp .2s cubic-bezier(0.16, 1, 0.3, 1)}
.reply-bar.show{display:flex}
.reply-bar-icon{width:28px;height:28px;border-radius:50%;background:#e8f9ee;color:var(--primary);display:grid;place-items:center;font-size:12px;flex:none}
.reply-bar-text{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12.5px}
.reply-bar-text b{color:var(--text);margin-right:4px}
.reply-bar button{border:0;background:transparent;color:var(--muted);font-size:16px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;transition:background .15s}
.reply-bar button:hover{background:var(--surface2);color:var(--text)}

@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}

/* メッセージコンポーザー（入力フォーム） */
.composer-wrapper{background:#fff;border-top:1px solid var(--border);padding:10px 16px 14px}
.composer{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid transparent;border-radius:24px;padding:4px 6px 4px 16px;transition:all .2s ease}
.composer:focus-within{background:#fff;border-color:var(--primary);box-shadow:0 0 0 3px rgba(6,199,85,0.15)}
.composer input{flex:1;min-width:0;border:0;background:transparent;padding:8px 0;outline:0;font-size:14.5px;color:var(--text)}
.composer input::placeholder{color:#a0aec0}
.send{width:36px;height:36px;border:0;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:14px;flex:none;transition:all .15s ease}
.send:hover{background:var(--primary2);transform:scale(1.05)}
.send:active{transform:scale(0.95)}

/* パネル・モーダル等のスタイル */
.panel{padding:22px;overflow:auto;height:100%;background:#fff}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.panel-head h2{margin-bottom:0;font-weight:800}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:13px;box-shadow:0 4px 15px rgba(0,0,0,.03)}
.profile{display:flex;gap:14px;align-items:center}
.big-avatar{width:64px;height:64px;border-radius:22px;background:linear-gradient(135deg,#06c755,#34d399);color:#fff;display:grid;place-items:center;font-size:26px}
.muted{color:var(--muted);font-size:12px}
.field{margin-top:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px;outline:0;background:var(--surface2)}
.field input:focus{background:#fff;border-color:var(--primary)}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--primary);color:#fff;font-weight:700;transition:background .15s}
.btn:hover{background:var(--primary2)}
.btn.secondary{background:#edf2f7;color:#334155}
.btn.secondary:hover{background:#e2e8f0}
.btn.danger{background:#ffe5e5;color:#dc2626}
.btn.danger:hover{background:#fcd3d3}
.btn.success{background:#e8f9ee;color:var(--primary2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.invite-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--primary);color:#fff;font-size:10px;margin-left:4px;font-weight:700}
.invite-card{border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;background:#fff}
.invite-title{font-weight:700;font-size:14px}
.invite-info{font-size:12px;color:var(--muted);margin-top:4px}
.loading-overlay{position:absolute;inset:0;background:rgba(255,255,255,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;gap:12px;color:var(--muted);font-size:13px;font-weight:600}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px}
.toast{background:#111827;color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;box-shadow:0 10px 25px rgba(0,0,0,.15);display:flex;align-items:center;gap:10px;animation:slideIn .2s forwards;font-weight:600}
.toast.error{background:var(--danger)}
.toast.success{background:var(--primary)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(3px);display:grid;place-items:center;padding:15px;z-index:20}
.modal-box{width:min(460px,100%);max-height:90dvh;overflow:auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-box h3{margin-bottom:15px;font-weight:800}
.modal-box input{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;outline:0;margin-bottom:10px;background:var(--surface2)}
.modal-box input:focus{background:#fff;border-color:var(--primary)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.qr{background:#fff;padding:12px;display:grid;place-items:center;margin:10px auto;border-radius:12px;width:max-content;border:1px solid var(--border)}
.auth{position:fixed;inset:0;background:linear-gradient(135deg,#e8f9ee,#f4fbf7);display:grid;place-items:center;padding:18px;z-index:100}
.auth-card{width:min(410px,100%);background:#fff;border:1px solid var(--border);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
.auth-card h1{margin-bottom:6px;color:var(--primary);font-weight:800}
.auth-card p{color:var(--muted);font-size:13px;margin-bottom:20px}
.auth-card input{width:100%;padding:12px;margin-bottom:12px;border:1px solid var(--border);border-radius:12px;outline:0;background:var(--surface2)}
.auth-card input:focus{background:#fff;border-color:var(--primary)}
.auth-card .btn{width:100%;padding:13px;border-radius:12px;font-size:15px}
.auth-switch{text-align:center;margin-top:16px;font-size:12.5px;color:var(--muted)}
.auth-switch button{border:0;background:none;color:var(--primary);font-weight:700}
#reader{width:100%}
@media(max-width:800px){
.app{width:100%}
.sidebar{width:100%}
.main{position:fixed;inset:0;transform:translateX(100%);transition:.22s;z-index:10}
.main.open{transform:translateX(0)}
.back{display:inline-flex!important}
.messages{padding:15px 12px}
.msg{max-width:85%}
}
@media(min-width:801px){.mobile-back{display:none!important}}
</style>
</head>
<body>
<div id="toastContainer" class="toast-container"></div>
<div id="auth" class="auth">
<div class="auth-card">
<h1><i class="fa-solid fa-comments"></i> schat</h1>
<p id="authDesc">ユーザー名とパスワードでログイン</p>
<input id="authUser" autocomplete="username" placeholder="ユーザー名">
<input id="authPass" autocomplete="current-password" type="password" placeholder="パスワード">
<input id="authName" class="hidden" autocomplete="name" placeholder="表示名">
<button class="btn" id="authBtn">ログイン</button>
<div class="auth-switch"><span id="authSwitchText">アカウントを作成する</span><button id="authSwitch">新規登録</button></div>
<div id="authError" class="muted" style="margin-top:10px;color:#dc2626"></div>
</div>
</div>
<div class="app">
<aside class="sidebar">
<div class="topbar">
<div class="brand"><i class="fa-solid fa-comments"></i>schat<span id="totalUnreadBadge" class="brand-unread hidden">0</span></div>
<div class="top-actions">
<button class="icon" title="フレンド追加" onclick="openFriend()"><i class="fa-solid fa-user-plus"></i></button>
<button class="icon" title="グループ作成" onclick="openGroup()"><i class="fa-solid fa-users"></i></button>
</div>
</div>
<div class="search"><input id="search" placeholder="チャットを検索"></div>
<div class="plan"><i class="fa-solid fa-shield-halved"></i> サーバー経由・セキュアモード</div>
<div id="rooms" class="rooms"></div>
<div class="nav">
<button id="navChat" class="active" onclick="tab('chat')"><i class="fa-solid fa-message"></i>チャット</button>
<button id="navFriends" onclick="tab('friends')"><i class="fa-solid fa-address-book"></i>フレンド<span id="inviteBadge" class="invite-badge hidden">0</span></button>
<button id="navAccount" onclick="tab('account')"><i class="fa-solid fa-user"></i>アカウント</button>
</div>
</aside>
<main id="main" class="main">
<div id="loading" class="loading-overlay hidden"><div class="spinner"></div><div>読み込み中...</div></div>
<div id="empty" class="empty"><div><i class="fa-regular fa-comments"></i><p>チャットを選択してください</p></div></div>
<section id="chatView" class="hidden" style="height:100%;display:flex;flex-direction:column">
<div class="chat-head"><button class="icon back mobile-back" onclick="closeMain()"><i class="fa-solid fa-arrow-left"></i></button><div id="chatTitle" class="chat-title">チャット</div><div id="chatActions" class="chat-actions"></div></div>
<div id="messages" class="messages"></div>
<div id="replyBar" class="reply-bar"><div class="reply-bar-icon"><i class="fa-solid fa-reply"></i></div><div class="reply-bar-text" id="replyBarText"></div><button type="button" onclick="clearReply()" title="返信を解除"><i class="fa-solid fa-xmark"></i></button></div>
<div class="composer-wrapper">
<form id="composer" class="composer"><input id="message" maxlength="2000" placeholder="メッセージを入力..."><button class="send"><i class="fa-solid fa-paper-plane"></i></button></form>
</div>
</section>
<section id="friendsView" class="panel hidden">
<div class="panel-head"><button class="icon back mobile-back" onclick="closeMain()"><i class="fa-solid fa-arrow-left"></i></button><h2>フレンド</h2></div>
<div class="actions"><button class="btn" onclick="openFriend()">フレンド追加</button><button class="btn secondary" onclick="openQR()">自分のQR</button></div>
<div id="friendRequestsArea" style="margin-top:20px"></div>
<div id="invitesArea" style="margin-top:20px"></div>
<div id="friendsList" style="margin-top:14px"></div>
</section>
<section id="accountView" class="panel hidden">
<div class="panel-head"><button class="icon back mobile-back" onclick="closeMain()"><i class="fa-solid fa-arrow-left"></i></button><h2>アカウント</h2></div>
<div class="card">
<div class="profile"><div class="big-avatar"><i class="fa-solid fa-user"></i></div><div><b id="meName"></b><div id="meUser" class="muted"></div></div></div>
<div class="field"><label>表示名</label><input id="displayName" maxlength="40"></div>
<div class="actions"><button class="btn" onclick="saveProfile()">更新</button><button class="btn secondary" onclick="openQR()">QRコード</button><button class="btn danger" onclick="logout()">ログアウト</button></div>
</div>
</section>
</main>
</div>
<div id="modal" class="modal hidden"><div id="modalBox" class="modal-box"></div></div>
<script>
let me=null,rooms=[],activeRoom=null,socket=null,scanner=null,registerMode=false,qrProcessing=false;
let unreadCounts={};
let onlineUsers=new Set();
let replyTarget=null;
const $=id=>document.getElementById(id);
function showAlert(msg,type="error"){
const container=$("toastContainer"),toast=document.createElement("div");
toast.className=`toast ${type}`;
toast.innerHTML=`<i class="fa-solid ${type==="error"?"fa-circle-exclamation":"fa-circle-check"}"></i> <span>${escapeHTML(msg)}</span>`;
container.appendChild(toast);
setTimeout(()=>{toast.style.opacity="0";toast.style.transition="opacity .3s";setTimeout(()=>toast.remove(),300)},4000);
}
function showLoading(show){$("loading").classList.toggle("hidden",!show)}
async function api(url,opts={}){
const r=await fetch(url,{credentials:"include",headers:{"Content-Type":"application/json",...(opts.headers||{})},...opts});
const d=await r.json().catch(()=>({}));
if(!r.ok)throw new Error(d.error||"通信エラー");
return d;
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function showAuthError(e){$("authError").textContent=e.message||String(e)}
function setAuthMode(reg){
registerMode=reg;
$("authName").classList.toggle("hidden",!reg);
$("authBtn").textContent=reg?"アカウント作成":"ログイン";
$("authDesc").textContent=reg?"新しいschatアカウントを作成":"ユーザー名とパスワードでログイン";
$("authSwitchText").textContent=reg?"既にアカウントがありますか？":"アカウントを作成する";
$("authSwitch").textContent=reg?"ログイン":"新規登録";
}
$("authSwitch").onclick=()=>setAuthMode(!registerMode);
$("authBtn").onclick=async()=>{
try{
$("authError").textContent="";
const body={username:$("authUser").value,password:$("authPass").value};
if(registerMode)body.displayName=$("authName").value;
const d=await api(registerMode?"/api/auth/register":"/api/auth/login",{method:"POST",body:JSON.stringify(body)});
me=d.user;
await startApp();
}catch(e){showAuthError(e)}
};
$("authPass").addEventListener("keydown",e=>{if(e.key==="Enter")$("authBtn").click()});
async function boot(){
try{
const d=await api("/api/auth/me");
me=d.user;
await startApp();
}catch{setAuthMode(false)}
}
async function startApp(){
$("auth").classList.add("hidden");
$("meName").textContent=me.display_name;
$("meUser").textContent="@"+me.username;
$("displayName").value=me.display_name;
connectSocket();
await loadRooms();
await loadFriends();
await loadFriendRequests();
await loadInvites();
}
function connectSocket(){
if(socket){
try{socket.disconnect()}catch{}
}
socket=io({withCredentials:true});
socket.on("connect",()=>{
if(activeRoom)socket.emit("room:join",activeRoom.id);
});
socket.on("presence:state",ids=>{
onlineUsers=new Set(ids||[]);
renderRooms();
renderFriendsPresence();
renderChatTitle();
});
socket.on("presence:update",data=>{
if(!data||!data.userId)return;
if(data.online)onlineUsers.add(data.userId);
else onlineUsers.delete(data.userId);
renderRooms();
renderFriendsPresence();
renderChatTitle();
});
socket.on("message:new",m=>{
if(!m||!m.room_id)return;
const visible=activeRoom&&m.room_id===activeRoom.id&&isChatVisible();
if(visible){
appendMessage(m,true);
markRoomRead(m.room_id);
}else{
unreadCounts[m.room_id]=(unreadCounts[m.room_id]||0)+1;
updateUnreadDisplay();
renderRooms();
}
});
socket.on("rooms:changed",()=>loadRooms());
socket.on("room:changed",()=>loadRooms());
socket.on("room:read",data=>{
if(data&&data.roomId){
unreadCounts[data.roomId]=0;
updateUnreadDisplay();
renderRooms();
if(data.roomId===activeRoom?.id)refreshMessageReadStates();
}
});
socket.on("message:read",data=>{
if(data?.roomId===activeRoom?.id)refreshMessageReadStates();
});
socket.on("invite:new",async invite=>{
await loadInvites();
if(invite?.room&&activeRoom&&invite.room.id===activeRoom.id)renderChatActions();
if("Notification" in window&&Notification.permission==="granted"){
try{new Notification("schat - グループ招待",{body:`${invite.inviter?.display_name||"ユーザー"}から「${invite.room?.name||"グループ"}」への招待が届きました。`})}catch{}
}
});
socket.on("invite:changed",()=>{
loadInvites();
loadRooms();
});
socket.on("friend:request",async()=>{
await loadFriendRequests();
showAlert("新しいフレンド申請が届きました","success");
});
socket.on("friend:new",async()=>{
await loadFriends();
await loadRooms();
showAlert("フレンドが追加されました","success");
});
}
async function loadRooms(){
try{
rooms=await api("/api/rooms");
unreadCounts={};
rooms.forEach(r=>unreadCounts[r.id]=Number(r.unread_count||0));
updateUnreadDisplay();
renderRooms();
}catch(e){showAlert(e.message)}
}
function updateUnreadDisplay(){
let total=0;
Object.values(unreadCounts).forEach(c=>total+=Number(c)||0);
const badge=$("totalUnreadBadge");
if(total>0){
badge.textContent=total>99?"99+":total;
badge.classList.remove("hidden");
}else badge.classList.add("hidden");
}
function renderRooms(){
const q=$("search").value.trim().toLowerCase();
$("rooms").innerHTML=rooms.filter(r=>(r.name||"").toLowerCase().includes(q)).map(r=>{
const unread=Number(unreadCounts[r.id]||0);
const online=r.peer_id?onlineUsers.has(r.peer_id):false;
return `<div class="room ${activeRoom&&activeRoom.id===r.id?"active":""}" onclick="openRoom('${r.id}')">
<div class="avatar">
<i class="fa-solid ${r.type==="group"?"fa-users":"fa-user"}"></i>
${r.type==="friend"?`<span class="presence-dot ${online?"online":""}"></span>`:""}
</div>
<div style="min-width:0;flex:1">
<div class="room-name">
<span>${escapeHTML(r.name)}</span>
${unread>0?`<span class="unread-badge">${unread>99?"99+":unread}</span>`:""}
</div>
<div class="room-meta">
${r.type==="group"?"グループ":online?'<span class="online-text">オンライン</span>':'<span class="offline-text">オフライン'}
${r.type==="friend"&&!online?"</span>":""}
</div>
</div>
</div>`;
}).join("")||'<div style="padding:25px;text-align:center;color:#8e8e93;font-size:12px">チャットがありません</div>';
}
$("search").oninput=renderRooms;
function isChatVisible(){
if(!activeRoom)return false;
if(document.visibilityState!=="visible")return false;
if($("chatView").classList.contains("hidden"))return false;
if(window.innerWidth<=800&&!$("main").classList.contains("open"))return false;
return true;
}
async function markRoomRead(roomId){
if(!roomId)return;
try{
await api("/api/rooms/"+roomId+"/read",{method:"POST"});
unreadCounts[roomId]=0;
updateUnreadDisplay();
renderRooms();
}catch{}
}
async function openRoom(roomId){
activeRoom=rooms.find(r=>r.id===roomId);
if(!activeRoom)return;
unreadCounts[roomId]=0;
updateUnreadDisplay();
$("empty").classList.add("hidden");
$("friendsView").classList.add("hidden");
$("accountView").classList.add("hidden");
$("chatView").classList.remove("hidden");
$("main").classList.add("open");
$("chatTitle").textContent=activeRoom.name;
renderChatActions();
renderRooms();
renderChatTitle();
showLoading(true);
try{
socket?.emit("room:join",roomId);
const msgs=await api("/api/rooms/"+roomId+"/messages");
$("messages").innerHTML="";
const messageMap=new Map(msgs.map(m=>[String(m.id),m]));
msgs.forEach(m=>{if(m.reply_to_id){m.reply_to_text=messageMap.get(String(m.reply_to_id))?.text||"返信先のメッセージ";}appendMessage(m,false);});
scrollMessages();
await markRoomRead(roomId);
}catch(e){
showAlert("メッセージの読み込みに失敗しました: "+e.message);
}finally{showLoading(false)}
}
function renderChatTitle(){
if(!activeRoom)return;
if(activeRoom.type==="friend"&&activeRoom.peer_id){
$("chatTitle").innerHTML=`${escapeHTML(activeRoom.name)} <span style="font-size:11px;font-weight:500;margin-left:6px" class="${onlineUsers.has(activeRoom.peer_id)?"online-text":"offline-text"}">${onlineUsers.has(activeRoom.peer_id)?"オンライン":"オフライン"}</span>`;
}else{
$("chatTitle").textContent=activeRoom.name;
}
}
function renderChatActions(){
$("chatActions").innerHTML="";
if(!activeRoom||activeRoom.type!=="group")return;
const button=document.createElement("button");
button.className="icon";
button.title="グループに招待";
button.innerHTML='<i class="fa-solid fa-user-plus"></i>';
button.onclick=()=>openGroupInvite(activeRoom.id);
$("chatActions").appendChild(button);
}
function appendMessage(m,scroll){
if($("messages").querySelector(`[data-message-id="${CSS.escape(String(m.id))}"]`))return;
const el=document.createElement("div");
el.dataset.messageId=m.id;
el.dataset.replyToId=m.reply_to_id||"";
el.className="msg "+(m.sender_id===me.id?"me":"other");
const replyHtml=m.reply_to_id&&m.reply_to_text?`<div class="reply-preview"><i class="fa-solid fa-reply"></i><span class="reply-preview-text">${escapeHTML(m.reply_to_text)}</span></div>`:"";
const readHtml=m.sender_id===me.id?`<span class="read-state">${m.read_by_all?"既読":"未読"}</span>`:"";
el.innerHTML=replyHtml+escapeHTML(m.text).replace(/\n/g,"<br>")+`<small>${new Date(m.created_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}${readHtml}</small>`;
addSwipeReply(el,m);
$("messages").appendChild(el);
if(scroll)scrollMessages();
}
function addSwipeReply(el,m){
let startX=0,startY=0,moved=false;
el.addEventListener("touchstart",e=>{const t=e.changedTouches[0];startX=t.clientX;startY=t.clientY;moved=false},{passive:true});
el.addEventListener("touchmove",e=>{const t=e.changedTouches[0];if(Math.abs(t.clientX-startX)>12||Math.abs(t.clientY-startY)>12)moved=true},{passive:true});
el.addEventListener("touchend",e=>{const t=e.changedTouches[0];const dx=t.clientX-startX;const dy=t.clientY-startY;if(moved&&dx<-60&&Math.abs(dx)>Math.abs(dy)*1.2)setReplyTarget(m)},{passive:true});
let pointerDown=false;
el.addEventListener("pointerdown",e=>{if(e.pointerType!=="touch")return;pointerDown=true;startX=e.clientX;startY=e.clientY});
el.addEventListener("pointerup",e=>{if(!pointerDown||e.pointerType!=="touch")return;pointerDown=false;const dx=e.clientX-startX;const dy=e.clientY-startY;if(dx<-60&&Math.abs(dx)>Math.abs(dy)*1.2)setReplyTarget(m)});
}
function setReplyTarget(m){
replyTarget=m;
document.querySelectorAll(".msg.replying").forEach(el=>el.classList.remove("replying"));
const el=$("messages").querySelector(`[data-message-id="${CSS.escape(String(m.id))}"]`);
if(el)el.classList.add("replying");
$("replyBarText").innerHTML=`<b>${m.sender_id===me.id?"自分":"相手"}</b> ${escapeHTML(m.text)}`;
$("replyBar").classList.add("show");
$("message").focus();
}
function clearReply(){
replyTarget=null;
document.querySelectorAll(".msg.replying").forEach(el=>el.classList.remove("replying"));
$("replyBar").classList.remove("show");
$("replyBarText").textContent="";
}
function refreshMessageReadStates(){
api("/api/rooms/"+activeRoom.id+"/messages").then(msgs=>{
msgs.forEach(m=>{
const el=$("messages").querySelector(`[data-message-id="${CSS.escape(String(m.id))}"]`);
if(!el||m.sender_id!==me.id)return;
const small=el.querySelector("small");
if(!small)return;
const state=small.querySelector(".read-state");
if(state)state.textContent=m.read_by_all?"既読":"未読";
});
}).catch(()=>{});
}
function scrollMessages(){$("messages").scrollTop=$("messages").scrollHeight}
$("composer").onsubmit=async e=>{
e.preventDefault();
const text=$("message").value.trim();
if(!text||!activeRoom)return;
const replyTargetBeforeSend=replyTarget;
const replyToId=replyTargetBeforeSend?.id||null;
$("message").value="";
clearReply();
try{
await api("/api/rooms/"+activeRoom.id+"/messages",{method:"POST",body:JSON.stringify({text,replyToId})});
}catch(e){
showAlert(e.message);
$("message").value=text;
if(replyToId&&replyTargetBeforeSend)setReplyTarget(replyTargetBeforeSend)
}
};
function closeMain(){$("main").classList.remove("open")}
function tab(which){
document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
$("nav"+(which==="chat"?"Chat":which==="friends"?"Friends":"Account")).classList.add("active");
$("empty").classList.add("hidden");
$("chatView").classList.add("hidden");
$("friendsView").classList.add("hidden");
$("accountView").classList.add("hidden");
if(which==="chat"){
if(activeRoom){
$("chatView").classList.remove("hidden");
renderChatTitle();
if(isChatVisible())markRoomRead(activeRoom.id);
}else $("empty").classList.remove("hidden");
}else if(which==="friends"){
$("friendsView").classList.remove("hidden");
loadFriends();
loadFriendRequests();
loadInvites();
}else if(which==="account")$("accountView").classList.remove("hidden");
$("main").classList.add("open");
}
function closeModal(){
$("modal").classList.add("hidden");
$("modalBox").innerHTML="";
if(scanner){
scanner.stop().catch(()=>{});
scanner.clear().catch(()=>{});
scanner=null;
}
qrProcessing=false;
}
function modal(html){
$("modalBox").innerHTML=html;
$("modal").classList.remove("hidden");
}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function openGroup(){
modal(`<h3>グループを作成</h3><input id="groupName" maxlength="80" placeholder="グループ名"><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">キャンセル</button><button class="btn" onclick="createGroup()">作成</button></div>`);
}
async function createGroup(){
try{
const name=$("groupName").value.trim();
if(!name)return;
const r=await api("/api/rooms",{method:"POST",body:JSON.stringify({name})});
closeModal();
await loadRooms();
openRoom(r.id);
}catch(e){showAlert(e.message)}
}
function openFriend(){
modal(`<h3>フレンドを追加</h3><input id="friendUsername" placeholder="ユーザー名"><div class="modal-actions"><button class="btn" onclick="addFriend()">申請を送る</button></div><hr style="border:0;border-top:1px solid #e3e7ef;margin:15px 0"><button class="btn secondary" onclick="openQR()">自分のQRコードを表示</button><button class="btn" style="margin-left:7px" onclick="scanQR()">QRを読み取る</button>`);
}
async function addFriend(){
try{
const username=$("friendUsername").value.trim();
const d=await api("/api/friends/add",{method:"POST",body:JSON.stringify({username})});
closeModal();
showAlert(d.message||"フレンド申請を送信しました。","success");
}catch(e){showAlert(e.message)}
}
async function loadFriends(){
try{
const fs=await api("/api/friends");
$("friendsList").innerHTML=fs.length?fs.map(f=>{
const online=onlineUsers.has(f.friend.id);
return `<div class="card">
<div style="display:flex;align-items:center;gap:12px">
<div class="avatar"><i class="fa-solid fa-user"></i><span class="presence-dot ${online?"online":""}"></span></div>
<div><b>${escapeHTML(f.friend.display_name)}</b><div class="muted">@${escapeHTML(f.friend.username)}</div><div class="${online?"online-text":"offline-text"}" style="font-size:11px;margin-top:3px">${online?"オンライン":"オフライン"}</div></div>
</div>
<div class="actions"><button class="btn danger" onclick="removeFriend('${f.friend.id}')">削除</button></div>
</div>`;
}).join(""):'<div class="muted">フレンドがいません</div>';
}catch{}
}
function renderFriendsPresence(){
if($("friendsView")&&!$("friendsView").classList.contains("hidden"))loadFriends();
}
async function loadFriendRequests(){
try{
const reqs=await api("/api/friends/requests");
const container=$("friendRequestsArea");
if(!reqs.length){
container.innerHTML="";
updateBadge();
return;
}
container.innerHTML=`<h3 style="margin-bottom:10px">フレンド申請</h3>${reqs.map(r=>`<div class="invite-card"><div class="invite-title">${escapeHTML(r.user.display_name)}</div><div class="invite-info">@${escapeHTML(r.user.username)} さんからのフレンド申請</div><div class="actions"><button class="btn success" onclick="acceptFriendRequest('${r.user.id}')">許可</button><button class="btn danger" onclick="rejectFriendRequest('${r.user.id}')">拒否</button></div></div>`).join("")}`;
updateBadge();
}catch{}
}
async function acceptFriendRequest(id){
try{
const d=await api("/api/friends/accept",{method:"POST",body:JSON.stringify({requesterId:id})});
showAlert("フレンド申請を許可しました","success");
await loadFriendRequests();
await loadFriends();
await loadRooms();
if(d.room)openRoom(d.room.id);
}catch(e){showAlert(e.message)}
}
async function rejectFriendRequest(id){
try{
await api("/api/friends/reject",{method:"POST",body:JSON.stringify({requesterId:id})});
showAlert("フレンド申請を拒否しました");
await loadFriendRequests();
}catch(e){showAlert(e.message)}
}
async function removeFriend(id){
if(!confirm("このフレンドを削除しますか？"))return;
try{
await api("/api/friends/"+id,{method:"DELETE"});
await loadFriends();
await loadRooms();
showAlert("フレンドを削除しました");
}catch(e){showAlert(e.message)}
}
async function openQR(){
try{
const d=await api("/api/friends/qr");
modal(`<h3>マイQRコード</h3><div id="qrcode" class="qr"></div><p class="muted" style="text-align:center">QRコードは10分で期限切れになります。</p><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">閉じる</button></div>`);
new QRCode($("qrcode"),{text:d.token,width:220,height:220});
}catch(e){showAlert(e.message)}
}
async function scanQR(){
qrProcessing=false;
modal(`<h3>QRコードを読み取る</h3><div id="reader"></div><p class="muted">カメラへのアクセスを許可してください。</p><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">キャンセル</button></div>`);
scanner=new Html5Qrcode("reader");
try{
await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:230,height:230}},async text=>{
if(qrProcessing)return;
qrProcessing=true;
try{await scanner.stop()}catch{}
try{
const d=await api("/api/friends/qr",{method:"POST",body:JSON.stringify({token:text})});
closeModal();
showAlert(d.message||"処理が完了しました。","success");
await loadFriends();
await loadFriendRequests();
await loadRooms();
}catch(e){
qrProcessing=false;
showAlert(e.message);
}
},()=>{});
}catch(e){
showAlert("カメラを起動できません: "+e);
closeModal();
}
}
async function saveProfile(){
try{
const d=await api("/api/me",{method:"PUT",body:JSON.stringify({displayName:$("displayName").value.trim()})});
me=d.user;
$("meName").textContent=me.display_name;
showAlert("プロフィールを更新しました","success");
}catch(e){showAlert(e.message)}
}
async function logout(){
try{await api("/api/auth/logout",{method:"POST"})}finally{location.reload()}
}
async function openGroupInvite(roomId){
try{
const room=await api("/api/rooms/"+roomId);
modal(`<h3>「${escapeHTML(room.name)}」に招待</h3><input id="inviteUsername" maxlength="24" placeholder="招待するユーザー名"><div class="muted">ユーザー名を入力すると招待状を送信できます。</div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">キャンセル</button><button class="btn" onclick="sendGroupInvite('${roomId}')">招待状を送る</button></div>`);
}catch(e){showAlert(e.message)}
}
async function sendGroupInvite(roomId){
try{
const username=$("inviteUsername").value.trim();
if(!username)return;
await api("/api/rooms/"+roomId+"/invites",{method:"POST",body:JSON.stringify({username})});
closeModal();
showAlert("招待状を送信しました。","success");
}catch(e){showAlert(e.message)}
}
async function loadInvites(){
try{
const invites=await api("/api/invites");
if(!$("invitesArea"))return;
if(!invites.length){
$("invitesArea").innerHTML="";
updateBadge();
return;
}
$("invitesArea").innerHTML=`<h3 style="margin-bottom:10px">グループへの招待</h3>${invites.map(invite=>`<div class="invite-card"><div class="invite-title">${escapeHTML(invite.room.name)}</div><div class="invite-info">${escapeHTML(invite.inviter.display_name)}さんからの招待</div><div class="actions"><button class="btn success" onclick="acceptInvite('${invite.id}')">参加する</button><button class="btn danger" onclick="rejectInvite('${invite.id}')">拒否</button></div></div>`).join("")}`;
updateBadge();
}catch{
if($("invitesArea"))$("invitesArea").innerHTML="";
}
}
async function updateBadge(){
try{
const reqs=await api("/api/friends/requests").catch(()=>[]);
const invites=await api("/api/invites").catch(()=>[]);
const total=reqs.length+invites.length;
const badge=$("inviteBadge");
if(total>0){
badge.textContent=total>99?"99+":total;
badge.classList.remove("hidden");
}else badge.classList.add("hidden");
}catch{}
}
async function acceptInvite(id){
try{
const d=await api("/api/invites/"+id+"/accept",{method:"POST"});
await loadInvites();
await loadRooms();
showAlert("グループに参加しました。","success");
if(d.room)openRoom(d.room.id);
}catch(e){showAlert(e.message)}
}
async function rejectInvite(id){
try{
await api("/api/invites/"+id+"/reject",{method:"POST"});
await loadInvites();
showAlert("招待を拒否しました。");
}catch(e){showAlert(e.message)}
}
document.addEventListener("visibilitychange",()=>{
if(document.visibilityState==="visible"&&activeRoom&&isChatVisible())markRoomRead(activeRoom.id);
});
window.addEventListener("focus",()=>{
if(activeRoom&&isChatVisible())markRoomRead(activeRoom.id);
});
boot();
</script>
</body>
</html>
